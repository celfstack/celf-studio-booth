<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf1"/>
      <stop offset="1" stop-color="#f5ede2"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9b5ad"/>
      <stop offset=".16" stop-color="#f7f4ed"/>
      <stop offset=".5" stop-color="#cbc6bc"/>
      <stop offset=".82" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#aaa69e"/>
    </linearGradient>
    <pattern id="pinstripe" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#f9f4e9"/>
      <path d="M1 0v8M5 0v8" stroke="#d9d3c8" stroke-width="1" opacity=".55"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="10" dy="13" stdDeviation="5" flood-color="#5f5549" flood-opacity=".2"/>
    </filter>
    <filter id="stripShadow" x="-40%" y="-20%" width="180%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#211b16" flood-opacity=".28"/>
    </filter>
    <clipPath id="machineClip">
      <rect x="675" y="86" width="400" height="500" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#faf6ef"/>
  <circle cx="97" cy="83" r="4" fill="#a93f30" opacity=".6"/>
  <circle cx="111" cy="83" r="2" fill="#a93f30" opacity=".3"/>
  <path d="M73 475l8 17 18 8-18 8-8 18-8-18-18-8 18-8z" fill="#c8c2b8" opacity=".8"/>
  <path d="M591 74l6 13 13 6-13 6-6 13-6-13-13-6 13-6z" fill="#c8c2b8"/>

  <g fill="#2a241f">
    <text x="88" y="215" font-family="Arial Narrow, Helvetica Neue, sans-serif" font-size="91" font-weight="500" letter-spacing="-5">celf studio</text>
    <text x="94" y="265" font-family="Arial Narrow, Helvetica Neue, sans-serif" font-size="30" fill="#73685e">a little photo booth, just for you</text>
  </g>
  <g transform="translate(92 350)">
    <rect width="350" height="66" rx="33" fill="#2a241f"/>
    <text x="175" y="43" text-anchor="middle" font-family="Arial Narrow, Helvetica Neue, sans-serif" font-size="28" font-weight="600" fill="#fffaf1">click to step in →</text>
  </g>
  <text x="94" y="555" font-family="Courier New, monospace" font-size="18" letter-spacing="2" fill="#73685e">made with &lt;3 by @celfstudies</text>

  <g filter="url(#shadow)">
    <rect x="675" y="86" width="400" height="500" rx="18" fill="url(#pinstripe)" stroke="#5d574f" stroke-width="4"/>
    <rect x="689" y="100" width="372" height="472" rx="11" fill="none" stroke="#a49d92" stroke-width="2"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="729" y="28" width="292" height="136" rx="10" fill="url(#paper)" stroke="#5d574f" stroke-width="4"/>
    <rect x="740" y="39" width="270" height="114" rx="5" fill="none" stroke="#a49d92" stroke-width="2"/>
    <text x="875" y="75" text-anchor="middle" font-family="Courier New, monospace" font-size="24" font-weight="700" letter-spacing="4" fill="#2a241f">PHOTOS</text>
    <text x="875" y="108" text-anchor="middle" font-family="Courier New, monospace" font-size="24" font-weight="700" letter-spacing="4" fill="#2a241f">DELIVERED</text>
    <text x="875" y="141" text-anchor="middle" font-family="Courier New, monospace" font-size="24" font-weight="700" letter-spacing="4" fill="#2a241f">HERE</text>
  </g>
  <g>
    <rect x="742" y="176" width="266" height="54" rx="7" fill="url(#metal)" stroke="#69645d" stroke-width="3"/>
    <circle cx="760" cy="203" r="8" fill="#aaa69e" stroke="#625e58"/>
    <circle cx="990" cy="203" r="8" fill="#aaa69e" stroke="#625e58"/>
    <rect x="780" y="192" width="190" height="22" rx="11" fill="#191713"/>
  </g>
  <g clip-path="url(#machineClip)">
    <image href="home-photo-strip.png" x="795" y="214" width="160" height="480" preserveAspectRatio="xMidYMid meet" filter="url(#stripShadow)"/>
  </g>

  <g opacity=".96">
    <image href="decorations/stars/silver-glitter.png" x="693" y="221" width="52" height="52"/>
    <image href="decorations/stars/chrome-puff.png" x="1026" y="275" width="55" height="55"/>
    <image href="decorations/stars/silver-sketch.png" x="711" y="395" width="44" height="44"/>
    <image href="decorations/stars/silver-faceted.png" x="1005" y="453" width="48" height="48"/>
    <image href="decorations/stars/chrome-sparkle.png" x="760" y="318" width="35" height="35"/>
    <image href="decorations/stars/white-paper.png" x="963" y="363" width="37" height="37"/>
    <image href="decorations/stars/chrome-puff.png" x="730" y="515" width="42" height="42"/>
  </g>
</svg>
